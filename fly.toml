# fly.toml app configuration file generated for fantasy-scoreboard on 2026-10-08T05:01:07-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'fantasy-scoreboard'
primary_region = 'ord'

[build]
# data/ (uploaded DK salaries, Sleeper cache) lives on a volume so it survives deploys
[mounts]
  source = 'scoreboard_data'
  destination = '/app/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '512mb'
  cpus = 1
  memory_mb = 512
